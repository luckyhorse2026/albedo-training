[project]
name = "albedo-training"
version = "0.1.0"
description = "On-policy training packs for Albedo SN97"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
